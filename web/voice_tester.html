<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Service Tester</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1e8;
      --ink: #1c2421;
      --muted: #67716d;
      --line: #d8d0c0;
      --panel: #fffdf6;
      --accent: #0e7c66;
      --accent-ink: #ffffff;
      --warn: #a44817;
      --good: #0f6b40;
      --bad: #a12929;
      --shadow: 0 18px 50px rgba(38, 32, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(135deg, rgba(14, 124, 102, 0.13), transparent 34%),
        linear-gradient(180deg, #fbf8ef 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      min-height: 100vh;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1;
      letter-spacing: 0;
      font-family: Georgia, "Times New Roman", serif;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: color-mix(in srgb, var(--panel) 94%, white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #34423d;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #c8bdab;
      border-radius: 6px;
      background: #fffefa;
      color: var(--ink);
      font: inherit;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 124, 102, 0.15);
    }

    textarea {
      min-height: 138px;
      resize: vertical;
      line-height: 1.45;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #e6decf;
      color: #15201c;
      cursor: pointer;
      font-weight: 800;
      padding: 11px 14px;
      min-height: 42px;
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbf7ed;
      min-height: 92px;
      padding: 12px;
      white-space: pre-wrap;
      color: #34423d;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      overflow: auto;
      max-height: 260px;
    }

    .result {
      display: grid;
      gap: 12px;
    }

    audio {
      width: 100%;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #e8efe7;
      color: var(--good);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }

    .pill.warn {
      background: #f4e4d6;
      color: var(--warn);
    }

    .pill.bad {
      background: #f3dddd;
      color: var(--bad);
    }

    .linkbox {
      display: none;
      gap: 8px;
    }

    .linkbox.visible {
      display: grid;
    }

    .linkbox a {
      color: var(--accent);
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .voice-meta {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 20px, 680px);
        padding-top: 20px;
      }

      header,
      .grid,
      .row {
        grid-template-columns: 1fr;
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Voice Service Tester</h1>
        <p class="subtitle">Nhap API URL, chon voice, tao audio va nghe thu truc tiep.</p>
      </div>
      <span id="healthBadge" class="pill warn">Chua ket noi</span>
    </header>

    <div class="grid">
      <section class="panel stack">
        <label>
          API base URL
          <input id="baseUrl" placeholder="https://xxxxx.trycloudflare.com hoac http://127.0.0.1:7860">
        </label>

        <label>
          API key neu co
          <input id="apiKey" type="password" placeholder="Bo trong neu khong bat VOICE_SERVICE_API_KEY">
        </label>

        <div class="actions">
          <button id="healthBtn">Health</button>
          <button id="voicesBtn">Load voices</button>
          <button id="saveBtn">Luu URL</button>
        </div>

        <label>
          Voice
          <select id="voiceSelect"></select>
        </label>
        <div id="voiceMeta" class="voice-meta"></div>

        <label>
          Text
          <textarea id="textInput">Xin chao, day la doan test voice tu voice-service.</textarea>
        </label>

        <div class="row">
          <label>
            Speed
            <input id="speedInput" type="number" min="0.25" max="4" step="0.05" value="1">
          </label>

          <label>
            Output format
            <select id="formatSelect">
              <option value="wav">wav</option>
              <option value="mp3">mp3</option>
            </select>
          </label>
        </div>

        <label>
          Provider options JSON
          <textarea id="optionsInput" spellcheck="false" style="min-height: 82px;">{"noise_scale": 0.6}</textarea>
        </label>

        <div class="actions">
          <button id="ttsBtn" class="primary">Tao audio</button>
          <button id="clearBtn">Xoa log</button>
        </div>
      </section>

      <aside class="panel result">
        <h2 style="margin:0;font-size:22px;">Ket qua</h2>
        <audio id="audioPlayer" controls></audio>
        <div id="audioLinkBox" class="linkbox">
          <div class="small">Audio URL</div>
          <a id="audioLink" href="#" target="_blank" rel="noreferrer"></a>
        </div>
        <div id="resultMeta" class="small">Chua co audio.</div>
        <div id="statusLog" class="status"></div>
      </aside>
    </div>
  </main>

  <script>
    const els = {
      baseUrl: document.getElementById("baseUrl"),
      apiKey: document.getElementById("apiKey"),
      healthBtn: document.getElementById("healthBtn"),
      voicesBtn: document.getElementById("voicesBtn"),
      saveBtn: document.getElementById("saveBtn"),
      voiceSelect: document.getElementById("voiceSelect"),
      voiceMeta: document.getElementById("voiceMeta"),
      textInput: document.getElementById("textInput"),
      speedInput: document.getElementById("speedInput"),
      formatSelect: document.getElementById("formatSelect"),
      optionsInput: document.getElementById("optionsInput"),
      ttsBtn: document.getElementById("ttsBtn"),
      clearBtn: document.getElementById("clearBtn"),
      audioPlayer: document.getElementById("audioPlayer"),
      audioLinkBox: document.getElementById("audioLinkBox"),
      audioLink: document.getElementById("audioLink"),
      resultMeta: document.getElementById("resultMeta"),
      statusLog: document.getElementById("statusLog"),
      healthBadge: document.getElementById("healthBadge"),
    };

    let voices = [];
    let currentObjectUrl = "";

    function defaultBaseUrl() {
      const saved = localStorage.getItem("voiceServiceBaseUrl");
      if (saved) return saved;
      if (location.protocol === "http:" || location.protocol === "https:") {
        return location.origin;
      }
      return "http://127.0.0.1:7860";
    }

    function baseUrl() {
      return els.baseUrl.value.trim().replace(/\/+$/, "");
    }

    function headers(extra = {}) {
      const result = { ...extra };
      const key = els.apiKey.value.trim();
      if (key) result["X-API-Key"] = key;
      return result;
    }

    function log(message, data) {
      const time = new Date().toLocaleTimeString();
      let line = `[${time}] ${message}`;
      if (data !== undefined) {
        line += "\n" + JSON.stringify(data, null, 2);
      }
      els.statusLog.textContent = line + "\n\n" + els.statusLog.textContent;
    }

    async function request(path, options = {}) {
      const url = baseUrl() + path;
      const response = await fetch(url, {
        ...options,
        headers: headers(options.headers || {}),
      });
      const contentType = response.headers.get("content-type") || "";
      const data = contentType.includes("application/json")
        ? await response.json()
        : await response.text();
      if (!response.ok) {
        throw new Error(typeof data === "string" ? data : JSON.stringify(data));
      }
      return data;
    }

    function setBusy(isBusy) {
      for (const button of [els.healthBtn, els.voicesBtn, els.ttsBtn]) {
        button.disabled = isBusy;
      }
    }

    function setBadge(kind, text) {
      els.healthBadge.className = "pill" + (kind ? " " + kind : "");
      els.healthBadge.textContent = text;
    }

    function renderVoices(items) {
      voices = items || [];
      els.voiceSelect.innerHTML = "";
      for (const voice of voices) {
        const option = document.createElement("option");
        option.value = voice.voice_id;
        option.textContent = `${voice.voice_id} - ${voice.label} (${voice.provider})${voice.available ? "" : " [unavailable]"}`;
        els.voiceSelect.appendChild(option);
      }
      const preferred = voices.find((voice) => voice.available && voice.voice_id === "vneu:NgocHuyen")
        || voices.find((voice) => voice.available && voice.voice_id === "pth:default")
        || voices.find((voice) => voice.available && voice.provider === "edge_tts")
        || voices.find((voice) => voice.available && voice.voice_id !== "pth:stub")
        || voices.find((voice) => voice.available && voice.voice_id === "pth:stub")
        || voices[0];
      if (preferred) {
        els.voiceSelect.value = preferred.voice_id;
      }
      updateVoiceMeta();
    }

    function updateVoiceMeta() {
      const voice = voices.find((item) => item.voice_id === els.voiceSelect.value);
      if (!voice) {
        els.voiceMeta.textContent = "";
        return;
      }
      const availability = voice.available ? "available" : "unavailable";
      const loaded = voice.loaded === null || voice.loaded === undefined ? "unknown" : String(voice.loaded);
      if (voice.provider === "edge_tts") {
        els.formatSelect.value = "mp3";
      } else {
        els.formatSelect.value = "wav";
      }
      const stubWarning = voice.voice_id === "pth:stub"
        ? " | WARNING: pth:stub is only a synthetic hum test, not a real voice."
        : "";
      els.voiceMeta.textContent = `${availability} | loaded=${loaded} | language=${voice.language} | ${voice.notes || ""}${stubWarning}`;
    }

    async function checkHealth() {
      setBusy(true);
      try {
        const data = await request("/health");
        setBadge("", `OK ${data.device} v${data.version}`);
        log("Health OK", data);
      } catch (error) {
        setBadge("bad", "Ket noi loi");
        log("Health error: " + error.message);
      } finally {
        setBusy(false);
      }
    }

    async function loadVoices() {
      setBusy(true);
      try {
        const data = await request("/voices");
        renderVoices(data.voices || []);
        log(`Loaded ${voices.length} voices`, data.voices);
      } catch (error) {
        log("Load voices error: " + error.message);
      } finally {
        setBusy(false);
      }
    }

    function readProviderOptions() {
      const raw = els.optionsInput.value.trim();
      if (!raw) return {};
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("Provider options phai la object JSON.");
        }
        return parsed;
      } catch (error) {
        throw new Error("Provider options JSON sai: " + error.message);
      }
    }

    async function setAudioSource(audioUrl) {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = "";
      }

      if (!els.apiKey.value.trim()) {
        els.audioPlayer.src = audioUrl;
        return;
      }

      const response = await fetch(audioUrl, { headers: headers() });
      if (!response.ok) {
        throw new Error("Khong tai duoc audio output: " + response.status);
      }
      const blob = await response.blob();
      currentObjectUrl = URL.createObjectURL(blob);
      els.audioPlayer.src = currentObjectUrl;
    }

    async function synthesize() {
      setBusy(true);
      try {
        const payload = {
          text: els.textInput.value.trim(),
          voice_id: els.voiceSelect.value,
          speed: Number(els.speedInput.value || 1),
          output_format: els.formatSelect.value,
          provider_options: readProviderOptions(),
        };
        if (!payload.text) throw new Error("Nhap text truoc da.");
        if (!payload.voice_id) throw new Error("Chua co voice nao de test.");

        log("Sending TTS request", payload);
        const data = await request("/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        log("TTS response", data);

        if (!data.success) {
          els.resultMeta.textContent = data.error || "TTS failed.";
          setBadge("bad", "TTS loi");
          return;
        }

        await setAudioSource(data.audio_url);
        els.audioLink.href = data.audio_url;
        els.audioLink.textContent = data.audio_url;
        els.audioLinkBox.classList.add("visible");
        els.resultMeta.textContent = `${data.voice_id} | ${data.provider} | duration=${data.duration ?? "unknown"}s`;
        setBadge("", "TTS OK");
        await els.audioPlayer.play().catch(() => {});
      } catch (error) {
        setBadge("bad", "TTS loi");
        log("TTS error: " + error.message);
      } finally {
        setBusy(false);
      }
    }

    els.baseUrl.value = defaultBaseUrl();
    els.apiKey.value = localStorage.getItem("voiceServiceApiKey") || "";
    renderVoices([]);

    els.saveBtn.addEventListener("click", () => {
      localStorage.setItem("voiceServiceBaseUrl", baseUrl());
      localStorage.setItem("voiceServiceApiKey", els.apiKey.value.trim());
      log("Da luu URL/API key vao browser nay.");
    });
    els.healthBtn.addEventListener("click", checkHealth);
    els.voicesBtn.addEventListener("click", loadVoices);
    els.ttsBtn.addEventListener("click", synthesize);
    els.clearBtn.addEventListener("click", () => {
      els.statusLog.textContent = "";
    });
    els.voiceSelect.addEventListener("change", updateVoiceMeta);

    log("Mo /tester tu chinh service thi API URL se tu dung current origin.");
    checkHealth().then(loadVoices).catch(() => {});
  </script>
</body>
</html>
